services:
  backend:
    container_name: backend
    restart: always
    build:
      context: ./backend
    env_file:
      - .env
    ports:
      - ${BACKEND_PORT_FORWARD}:${BACKEND_PORT}

  frontend:
    container_name: frontend
    restart: always
    build:
      context: ./frontend
    env_file:
      - .env
    environment:
      REACT_APP_BACKEND_ADDR: ${BACKEND_ADDR}
    ports:
      - ${FRONTEND_PORT_FORWARD}:${FRONTEND_PORT}
    depends_on:
      - backend